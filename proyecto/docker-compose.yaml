services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8025:8025"
    volumes:
      - .:/app
    command: ["uv", "run", "jupyter", "lab", "--ip=0.0.0.0", "--port=8025", "--no-browser", "--allow-root", "--NotebookApp.token=''"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - jupyter